
  # Windows x64 con MinGW-w64 (issue #23), compilación cruzada desde Linux.
  mingw:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: MinGW (windows-x64, Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix ninja-build

      - name: Configurar
        run: cmake --preset mingw-x64-release

      - name: Compilar
        run: cmake --build --preset mingw-x64-release --target mu97k --parallel 4

      - name: Verificar que no dependa de las DLL de MinGW
        run: |
          set -e
          found=0
          for exe in $(find build/mingw-x64-release/bin -name '*.exe'); do
            dlls=$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            echo "$exe: $dlls"
            if echo "$dlls" | grep -qiE 'libstdc|libgcc|libwinpthread'; then found=1; fi
          done
          [ "$found" = 0 ]

      - name: Упаковать Windows x64 клиент
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/mingw-x64-release/bin/main.exe dist/main.exe

          git ls-files -z bin/Client/System bin/Client/Content |
          while IFS= read -r -d '' f; do
            dest="dist/${f#bin/Client/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

          test -f dist/main.exe
          test -d dist/System
          test -d dist/Content

      - uses: actions/upload-artifact@v6
        with:
          name: mu97k-windows-x64-release
          path: client/dist/**
          if-no-files-found: error
