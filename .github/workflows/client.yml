name: Windows x64 Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: client

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 (OpenGL + WebGPU)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg
        shell: bash
        run: |
          baseline=$(python ../.github/scripts/vcpkg_cache.py baseline)
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('client/vcpkg.json', 'client/vcpkg-configuration.json', 'client/cmake/triplets/x64-windows-mu.cmake') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Configure Windows x64
        run: cmake --preset windows-sdl3-x64-release

      - name: Build client
        run: cmake --build --preset windows-sdl3-x64-release --parallel 4

      - name: Package complete game client
        shell: bash
        run: |
          set -euo pipefail
          package="dist/mu97k-windows-x64"
          mkdir -p "$package"

          test -s bin/Client/main.exe
          cp bin/Client/main.exe "$package/main.exe"
          cp bin/Client/Config.ini "$package/Config.ini"

          while IFS= read -r -d '' file; do
            relative="${file#bin/Client/}"
            mkdir -p "$package/$(dirname "$relative")"
            cp "$file" "$package/$relative"
          done < <(git ls-files -z -- bin/Client/System bin/Client/Content)

          test -d "$package/System"
          test -d "$package/Content"
          test -n "$(find "$package/System" -type f -print -quit)"
          test -n "$(find "$package/Content" -type f -print -quit)"

          cat > "$package/README.txt" <<'EOF'
          MU Online 0.97k — Windows x64
          Start the game with main.exe.
          Keep main.exe, Config.ini, System and Content together in this folder.
          The client is configured for mucyber.eu.
          EOF

      - name: Upload ready-to-play Windows x64 client
        uses: actions/upload-artifact@v4
        with:
          name: mu97k-windows-x64
          path: client/dist/mu97k-windows-x64/
          if-no-files-found: error
          compression-level: 1
